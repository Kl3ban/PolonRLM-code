name: Checks

on:
  push:
  pull_request:

jobs:
  test:
    name: Node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/local-web-requirements.lock.txt
      - name: Install dependencies
        run: npm ci
      - name: Install local web test runtime
        run: python scripts/setup_local_web.py
      - name: Type check
        run: npm run check
      - name: Install headless browser for deterministic browser tests
        run: npx playwright install --with-deps chromium --only-shell
      - name: Run tests
        run: npm test
        env:
          POLONRLM_BROWSER_TEST_REQUIRED: '1'
      - name: Build
        run: npm run build
      - name: Check package contents
        run: npm run check:package
